name: Check

# On every push and pull request: the same verification as locally
# (scripts/check.sh), and the proof that the committed web/dist — which is
# embedded in the binaries — is exactly what web/src builds.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Check
        run: ./scripts/check.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Install (no scripts)
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Type-check and build
        working-directory: web
        run: npx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings && npx vite build --logLevel warn
      - name: web/dist is up to date
        run: git diff --exit-code -- web/dist
