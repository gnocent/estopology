# Test directory: dc=example,dc=org (same content as internal/auth/ldaptest).
include   /etc/ldap/schema/core.schema
include   /etc/ldap/schema/cosine.schema
include   /etc/ldap/schema/inetorgperson.schema
include   /etc/ldap/schema/nis.schema

modulepath /usr/lib/ldap
moduleload back_mdb
pidfile    /tmp/slapd.pid

TLSCertificateFile    /certs/server.crt
TLSCertificateKeyFile /certs/server.key
TLSCACertificateFile  /certs/ca.crt
# Simple binds only over TLS (ldaps://, or ldap:// after StartTLS).
security simple_bind=128

database  mdb
maxsize   104857600
suffix    "dc=example,dc=org"
rootdn    "cn=admin,dc=example,dc=org"
rootpw    admin-secret-not-used-by-estopo
directory /var/lib/ldap

access to attrs=userPassword
  by anonymous auth
  by self =x
  by * none
access to *
  by dn.exact="cn=estopo,ou=services,dc=example,dc=org" read
  by self read
  by * none
